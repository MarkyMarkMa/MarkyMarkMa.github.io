baseURL = "https://markymarkma.github.io/"
title = "Haofeng Ma"
theme = "hugo-coder"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
enableEmoji = true
disableKinds = ["taxonomy", "term"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[params]
  author = "Haofeng Ma"
  info = ["Undergraduate Researcher", "University of Nottingham Ningbo China"]
  description = "Haofeng Ma's academic homepage — time-series forecasting, deep learning, AI agents, and quantitative finance."
  keywords = "Haofeng Ma, time-series forecasting, deep learning, AI agents, large language models, quantitative finance"
  avatarURL = "images/avatar.svg"
  faviconSVG = "images/favicon.svg"
  since = 2026
  colorScheme = "auto"
  hideColorSchemeToggle = false
  customCSS = ["css/custom.css"]

[[params.social]]
