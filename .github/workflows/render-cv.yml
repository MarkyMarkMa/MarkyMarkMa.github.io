name: Render English CV

on:
  push:
    branches: [main]
    paths:
      - "_data/cv.yml"
      - "rendercv/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    name: RenderCV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: pip install "rendercv[full]==2.8"

      - name: Render CV
        run: |
          mkdir -p static/cv
          rendercv render _data/cv.yml --settings rendercv/settings.yaml
          rm -f static/cv/*.typ

      - name: Upload private CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-cv
          path: static/cv
          retention-days: 7

      - name: Commit generated PDF when changed
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add static/cv/Haofeng_Ma_CV.pdf
          if git diff --cached --quiet; then
            echo "Rendered CV is already up to date; nothing to commit."
          else
            git commit -m "chore: render the latest CV"
            git push
          fi
