name: Validate private site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Hugo site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.163.2"
          extended: true

      - name: Build site
        run: hugo --gc --minify --baseURL "http://127.0.0.1:8765/"

      - name: Upload private build artifact
        uses: actions/upload-artifact@v4
        with:
          name: private-site-build
          path: public
          retention-days: 7
