    Research Projects:
      - name: "PHAT: Modeling Period Heterogeneity for Multivariate Time Series Forecasting"
        summary: "ICLR 2026 Poster · Third author"
        highlights:
          - Models periodicity as an inductive bias for deep learning in multivariate time-series forecasting.
          - Develops temporal feature extraction and channel interaction mechanisms tailored to heterogeneous periodic patterns across variables.
          - Conducted in collaboration with the School of Artificial Intelligence and Data Science, University of Science and Technology of China.

      - name: "To See Far, Look Close: Evolutionary Forecasting for Long-term Time Series"
        summary: "Under review · Fourth author"
        highlights:
          - Studies the direct forecasting paradigm for long-horizon time series and introduces an evolutionary forecasting approach.
          - Trains on short, higher-confidence prediction windows and progressively extrapolates in blocks at inference time.
          - Conducted in collaboration with the School of Artificial Intelligence and Data Science, University of Science and Technology of China.

